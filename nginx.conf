user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access_log main;

    # Оптимизация отдачи файлов (включаем sendfile)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Скрывает версию Nginx в целях безопасности

    # Включаем Gzip сжатие (экономит трафик и ускоряет загрузку)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Описываем наш контейнер Nuxt как бэкенд
    upstream nuxt_backend {
        server nuxt-app:3000; # имя сервиса из docker-compose.yml
    }

    server {
        listen 80;
        server_name yourdomain.com ://yourdomain.com; # Замените на свой домен

        # 1. Раздача картинок напрямую через Nginx (в обход Nuxt)
        location /images/ {
            root /var/www/static; # Внутри контейнера Nginx путь будет /var/www/static/images/
            
            # Настройки кэширования в браузере (так как картинки меняются редко)
            expires 7d;
            add_header Cache-Control "public, no-transform";
            
            # Если картинка не найдена физически на диске, отдаем 404
            try_files $uri =404;
        }

        # 2. Все остальные запросы (SSR, роутинг, i18n) отправляем в Nuxt
        location / {
            proxy_pass http://nuxt_backend;
            
            # Передача реальных IP-адресов пользователей внутрь Nuxt
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Поддержка WebSockets (нужно для Nuxt/Nitro в некоторых сценариях)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
