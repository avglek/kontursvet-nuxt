version: '3.8'

services:
  nuxt-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kontursvet-nuxt-prod
    container_name: kontursvet-nuxt-prod
    expose:
      - '3000'
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - ./prod/locales:/app/i18n/locales
      - ./prod/images:/app/.output/public/images.
      - ./prod/data:/app/server/data
      - ./prod/logs:/app/logs
      - ./prod/ssl:/app/ssl

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    image: kontursvet-nginx-prod
    container_name: kontursvet-nginx-prod
    ports:
      - '80:80' # Для работы по HTTP
      # - "443:443" # Раскомментируйте, когда добавите SSL (Certbot)
    restart: unless-stopped
    volumes:
      # Пробрасываем конфиг Nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Пробрасываем ТУ ЖЕ папку с картинками в Nginx
      - ./prod/images:/var/www/static/images:ro
      - ./prod/logs:/var/log/nginx/
    depends_on:
      - nuxt-app
